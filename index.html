        <!-- Right Side Avatar/Image Container -->

            <img src="./images/photo.jpeg" alt="rashmi img" class="profile-img">
        </div>
    </main>


    <!-- Scripts for Particle Network & Typing Effect -->
    <script>
        // Interactive Particles.js Configuration (Constellation Effect)
        particlesJS("particles-js", {
            "particles": {
                "number": { "value": 70, "density": { "enable": true, "value_area": 800 } },
                "color": { "value": "#000000" },
                "shape": { "type": "circle" },
                "opacity": { "value": 0.4 },
                "size": { "value": 3.5, "random": true },
                "line_linked": {
                    "enable": true,
                    "distance": 150,
                    "color": "#888888",
                    "opacity": 0.4,
                    "width": 1
                },
                "move": { "enable": true, "speed": 2 }
            },
            "interactivity": {
                "events": {
                    "onhover": { "enable": true, "mode": "grab" },
                    "onclick": { "enable": true, "mode": "push" }
                }
            },
            "retina_detect": true
        });

        // Simple Typing Effect Script
        const roles = ["Full Stack Python", "Data Science", "Data Analyst"];
        let roleIndex = 0;
        let charIndex = 0;
        let isDeleting = false;
        const targetElement = document.getElementById("type-writer");

        function typeEffect() {
            const currentRole = roles[roleIndex];
            if (isDeleting) {
                targetElement.textContent = currentRole.substring(0, charIndex - 1);
                charIndex--;
            } else {
                targetElement.textContent = currentRole.substring(0, charIndex + 1);
                charIndex++;
            }

            let typeSpeed = isDeleting ? 50 : 100;

            if (!isDeleting && charIndex === currentRole.length) {
                typeSpeed = 2000; // Pause at end of word
                isDeleting = true;
            } else if (isDeleting && charIndex === 0) {
                isDeleting = false;
                roleIndex = (roleIndex + 1) % roles.length;
                typeSpeed = 500;
            }

            setTimeout(typeEffect, typeSpeed);
        }

        document.addEventListener("DOMContentLoaded", typeEffect);
    </script>
</body>
</html>
